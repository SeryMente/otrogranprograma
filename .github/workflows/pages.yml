name: Deploy a GitHub Pages

# Publica el sitio estatico (raiz del repo) en GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Construir bitácora personal
        run: python scripts/build-personal-blog.py
      - name: Verificar contrato de bitácora
        run: python scripts/test-personal-blog.py
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4
